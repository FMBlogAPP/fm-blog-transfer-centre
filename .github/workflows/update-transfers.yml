name: Update transfers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: transfer-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest transfers
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          sed -i 's/rows = api("leagues", country=country, search=query)/rows = api("leagues", search=query)/' scripts/update_transfers.py
          python scripts/update_transfers.py
          git restore scripts/update_transfers.py

      - name: Remove duplicate transfer records
        run: python scripts/cleanup_duplicates.py

      - name: Commit changed data
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh transfer data"
            git pull --rebase origin main
            git push
          fi
