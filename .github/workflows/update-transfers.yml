name: Update transfers

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/enrich_transfer_feed.py"
      - "scripts/enrich_players.py"
      - ".github/workflows/update-transfers.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: transfer-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest transfers
        if: github.event_name != 'push'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_transfers.py

      - name: Refresh player profiles
        if: github.event_name != 'push'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/enrich_players.py

      - name: Remove duplicate transfer records
        run: python scripts/cleanup_duplicates.py

      - name: Build product feed
        run: python scripts/enrich_transfer_feed.py

      - name: Commit changed data
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh transfer data"
            git fetch origin main
            git rebase origin/main
            git push
          fi
