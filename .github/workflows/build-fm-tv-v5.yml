name: Build FM TV V5 Fixed Embed

on:
  push:
    paths:
      - ".github/workflows/build-fm-tv-v5.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create versioned fixed embed
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('fm-tv/blogger-embed.html')
          dst = Path('fm-tv/blogger-embed-v5-fixed.html')
          s = src.read_text(encoding='utf-8')
          # Hard guarantee the old typo is gone.
          s = s.replace('el.trendingRow', 'el.trendRow')
          # Add an unmistakable build marker.
          s = s.replace('<div id="fmtv-app">', '<!-- FM TV BUILD V5 FIXED 2026-08-12-2225 -->\n<div id="fmtv-app" data-fmtv-build="v5-fixed-2026-08-12-2225">', 1)
          # Stronger container-safe header rules appended after existing CSS.
          override = '''\n<style id="fmtv-v5-hotfix">\n#fmtv-app .yt-topbar{grid-template-columns:170px minmax(0,1fr) auto!important;gap:10px!important;padding:12px 14px!important}\n#fmtv-app .yt-search{min-width:0!important}\n#fmtv-app .yt-top-actions{display:flex!important;align-items:center!important;gap:7px!important;flex-wrap:nowrap!important;min-width:0!important}\n#fmtv-app .yt-top-actions .yt-pill{flex:0 0 auto!important;padding:0 10px!important}\n#fmtv-app .yt-chipbar{position:relative!important;top:auto!important}\n@media(max-width:1050px){#fmtv-app .yt-topbar{grid-template-columns:150px minmax(0,1fr)!important}#fmtv-app .yt-top-actions{grid-column:1/-1!important;justify-content:flex-start!important;overflow-x:auto!important;padding-bottom:2px!important}#fmtv-app .yt-top-actions::-webkit-scrollbar{display:none!important}}\n@media(max-width:720px){#fmtv-app .yt-topbar{display:flex!important;flex-wrap:wrap!important;padding:10px 12px!important}#fmtv-app .yt-brand{flex:1 1 auto!important}#fmtv-app .yt-search{order:3!important;flex:1 0 100%!important}#fmtv-app .yt-top-actions{order:4!important;width:100%!important}#fmtv-app .yt-pill{height:34px!important}}\n</style>\n'''
          s = s.replace('</style>\n\n<div class="yt-shell">', '</style>' + override + '\n<div class="yt-shell">', 1)
          dst.write_text(s, encoding='utf-8')
          PY

      - name: Validate old crash is absent
        run: |
          if grep -q 'el\.trendingRow' fm-tv/blogger-embed-v5-fixed.html; then
            echo 'Old trendingRow crash still present' >&2
            exit 1
          fi
          grep -q 'el\.trendRow\.innerHTML' fm-tv/blogger-embed-v5-fixed.html
          grep -q 'data-fmtv-build="v5-fixed-2026-08-12-2225"' fm-tv/blogger-embed-v5-fixed.html

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('fm-tv/blogger-embed-v5-fixed.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('No script found')
          Path('/tmp/fmtv-v5.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/fmtv-v5.js

      - name: Commit versioned embed
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v5-fixed.html
          git commit -m "fix: add verified FM TV v5 Blogger embed"
          git push
