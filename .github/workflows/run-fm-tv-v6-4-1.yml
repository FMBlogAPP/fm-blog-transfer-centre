name: Run FM TV V6.4.1 Thumbnail Fix

on:
  push:
    paths:
      - "fm-tv/scripts/build_v6_4_1_thumbfix.py"
      - ".github/workflows/run-fm-tv-v6-4-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V6.4.1
        run: python fm-tv/scripts/build_v6_4_1_thumbfix.py

      - name: Validate V6.4.1
        run: |
          grep -q "FM TV BUILD V6.4.1 THUMBNAIL FIX" fm-tv/blogger-embed-v6-4-1.html
          grep -q "fmtv-v6-4-1-thumbfix" fm-tv/blogger-embed-v6-4-1.html
          grep -q "vertical-align:top!important" fm-tv/blogger-embed-v6-4-1.html
          grep -q "object-fit:cover!important" fm-tv/blogger-embed-v6-4-1.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('fm-tv/blogger-embed-v6-4-1.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/fmtv-v641.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fmtv-v641.js

      - name: Commit V6.4.1
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v6-4-1.html
          if git diff --cached --quiet; then
            echo "No V6.4.1 changes."
          else
            git commit -m "fix: hard reset FM TV thumbnail rendering"
            git pull --rebase origin main
            git push
          fi
