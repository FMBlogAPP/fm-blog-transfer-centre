name: Build Transfer Centre V4 Runtime

on:
  push:
    paths:
      - 'scripts/build_v4_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frame-aware runtime
        run: python scripts/build_v4_runtime.py
      - name: Commit frontend build
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/transfer-centre-v4.js transfer-centre-app-v4.html
          if git diff --cached --quiet; then
            echo "No frontend changes."
          else
            git commit -m "build: frame-aware Transfer Centre V4 runtime"
            git pull --rebase origin main
            git push
          fi
