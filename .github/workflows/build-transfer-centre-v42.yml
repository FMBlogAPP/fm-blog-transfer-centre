name: Build Transfer Centre V4.2

on:
  push:
    paths:
      - 'scripts/build_v42.py'
      - '.github/workflows/build-transfer-centre-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build V4.2
        run: python scripts/build_v42.py
      - name: Commit frontend build
        run: |
          git config user.name "FM Blog Transfer Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/transfer-centre-v42.js transfer-centre-app-v4.html
          git diff --cached --quiet && exit 0
          git commit -m "Build Transfer Centre V4.2 navigation fix"
          git pull --rebase origin main
          git push
