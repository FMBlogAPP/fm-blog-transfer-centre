name: Build FM TV V6.1 Archive Search

on:
  push:
    paths:
      - ".github/workflows/build-fm-tv-v6-1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V6.1 from V6
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('fm-tv/blogger-embed-v6.html')
          out = Path('fm-tv/blogger-embed-v6-1.html')
          s = src.read_text(encoding='utf-8')

          s = s.replace('<!-- FM TV BUILD V6 2026-08-12 -->', '<!-- FM TV BUILD V6.1 2026-08-12 -->', 1)
          s = s.replace('data-fmtv-build="v6-2026-08-12"', 'data-fmtv-build="v6-1-2026-08-12"', 1)

          old_state = "state={data:null,archive:null,archiveLoading:false,mode:'latest',category:'',creator:'',query:'',creatorQuery:'',shown:12,favs:new Set()}"
          new_state = "state={data:null,archive:null,archiveLoading:false,mode:'latest',category:'',creator:'',query:'',creatorQuery:'',shown:12,searchTimer:null,favs:new Set()}"
          if old_state not in s:
              raise SystemExit('state marker missing')
          s = s.replace(old_state, new_state, 1)

          old_pool = "function pool(){return state.creator&&state.archive?state.archive.videos:((state.data&&state.data.videos)||[])}"
          new_pool = "function wantsArchive(){return!!state.creator||!!state.category||state.mode==='favourites'||state.query.trim().length>=2}function pool(){return state.archive&&wantsArchive()?state.archive.videos:((state.data&&state.data.videos)||[])}"
          if old_pool not in s:
              raise SystemExit('pool marker missing')
          s = s.replace(old_pool, new_pool, 1)

          old_mode = "function goMode(mode){state.creator='';state.category='';state.mode=mode||'latest';state.shown=state.mode==='latest'?12:24;renderAll();setHash();scrollToNode(state.mode==='latest'?el.gridSection:el.channelHead)}"
          new_mode = "function goMode(mode){state.creator='';state.category='';state.mode=mode||'latest';state.shown=state.mode==='latest'?12:24;renderAll();setHash();scrollToNode(state.mode==='latest'?el.gridSection:el.channelHead);if(state.mode==='favourites'&&!state.archive)ensureArchive()}"
          if old_mode not in s:
              raise SystemExit('goMode marker missing')
          s = s.replace(old_mode, new_mode, 1)

          old_cat = "state.category=node.getAttribute('data-cat')||'';state.shown=state.category?24:12;renderAll();setHash();scrollToNode(state.category?el.channelHead:el.gridSection)}})}"
          new_cat = "state.category=node.getAttribute('data-cat')||'';state.shown=state.category?24:12;renderAll();setHash();scrollToNode(state.category?el.channelHead:el.gridSection);if(state.category&&!state.archive)ensureArchive()}})}"
          if old_cat not in s:
              raise SystemExit('category handler marker missing')
          s = s.replace(old_cat, new_cat, 1)

          old_input = "el.search.addEventListener('input',function(){state.query=el.search.value;state.shown=12;renderGrid();bindInteractive(root)});"
          new_input = "el.search.addEventListener('input',function(){state.query=el.search.value;state.shown=24;renderGrid();bindInteractive(root);if(state.searchTimer)clearTimeout(state.searchTimer);if(state.query.trim().length>=2&&!state.archive){state.searchTimer=setTimeout(function(){ensureArchive()},350)}});"
          if old_input not in s:
              raise SystemExit('search input marker missing')
          s = s.replace(old_input, new_input, 1)

          old_btn = "el.searchBtn.addEventListener('click',function(){state.query=el.search.value;state.shown=24;renderGrid();bindInteractive(root);scrollToNode(el.gridSection)})"
          new_btn = "el.searchBtn.addEventListener('click',function(){state.query=el.search.value;state.shown=24;renderGrid();bindInteractive(root);scrollToNode(el.gridSection);if(state.query.trim().length>=2&&!state.archive)ensureArchive()})"
          if old_btn not in s:
              raise SystemExit('search button marker missing')
          s = s.replace(old_btn, new_btn, 1)

          old_hash = "if(state.creator&&!state.archive)ensureArchive()"
          if old_hash not in s:
              raise SystemExit('hash archive marker missing')
          s = s.replace(old_hash, "if(wantsArchive()&&!state.archive)ensureArchive()")

          old_initial = "if(state.creator)ensureArchive()"
          if old_initial not in s:
              raise SystemExit('initial archive marker missing')
          s = s.replace(old_initial, "if(wantsArchive())ensureArchive()", 1)

          # Give search users an explicit full-archive signal in the grid header.
          old_render = "else if(state.category){el.gridTitle.textContent=state.category+' videos';el.gridNote.textContent='Latest '+state.category.toLowerCase()+' from the FM community'}else{el.gridTitle.textContent='Latest from the FM community';el.gridNote.textContent=''}"
          new_render = "else if(state.category){el.gridTitle.textContent=state.category+' videos';el.gridNote.textContent=state.archive?'Past-year '+state.category.toLowerCase()+' from the FM community':'Loading recent '+state.category.toLowerCase()+' videos...'}else if(state.query.trim()){el.gridTitle.textContent='Search results for “'+state.query.trim()+'”';el.gridNote.textContent=state.archive?'Searching the past 365 days':'Searching recent videos while the full archive loads...'}else{el.gridTitle.textContent='Latest from the FM community';el.gridNote.textContent=''}"
          if old_render not in s:
              raise SystemExit('render note marker missing')
          s = s.replace(old_render, new_render, 1)

          out.write_text(s, encoding='utf-8')
          print('Built', out, len(s), 'bytes')
          PY

      - name: Validate V6.1 markers
        run: |
          grep -q 'FM TV BUILD V6.1' fm-tv/blogger-embed-v6-1.html
          grep -q 'function wantsArchive()' fm-tv/blogger-embed-v6-1.html
          grep -q "state.mode==='favourites'" fm-tv/blogger-embed-v6-1.html
          grep -q 'searchTimer' fm-tv/blogger-embed-v6-1.html
          grep -q 'Searching the past 365 days' fm-tv/blogger-embed-v6-1.html

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('fm-tv/blogger-embed-v6-1.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('script missing')
          Path('/tmp/fmtv-v61.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/fmtv-v61.js

      - name: Commit V6.1
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v6-1.html
          git commit -m "feat: search FM TV across one-year archive"
          git push
