name: Build Transfer Centre V4.3

on:
  push:
    paths:
      - "scripts/build_v43.py"
      - ".github/workflows/build-transfer-centre-v43.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-centre-v43-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build V4.3
        run: python scripts/build_v43.py
      - name: Commit frontend build
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/transfer-centre-v43.js transfer-centre-app-v4.html
          if git diff --cached --quiet; then
            echo "No frontend changes."
          else
            git commit -m "feat: Transfer Centre V4.3 navigation and names"
            git pull --rebase origin main
            git push
          fi
