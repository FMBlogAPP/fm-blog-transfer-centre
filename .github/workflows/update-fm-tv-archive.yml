name: Update FM TV Archive

on:
  workflow_dispatch:
  push:
    paths:
      - "fm-tv/config.json"
      - "fm-tv/scripts/update_youtube.py"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: fm-tv-archive-updater
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one-year YouTube archive
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FM_TV_MODE: archive
        run: python fm-tv/scripts/update_youtube.py

      - name: Commit changed FM TV archive
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/data/archive.json
          if git diff --cached --quiet; then
            echo "No FM TV archive changes."
          else
            git commit -m "chore: refresh FM TV archive"
            git pull --rebase origin main
            git push
          fi
