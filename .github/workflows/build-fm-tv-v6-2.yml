name: Build FM TV V6.2 Smart Search

on:
  push:
    paths:
      - ".github/workflows/build-fm-tv-v6-2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V6.2 from V6.1
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('fm-tv/blogger-embed-v6-1.html')
          out=Path('fm-tv/blogger-embed-v6-2.html')
          s=src.read_text(encoding='utf-8')
          s=s.replace('<!-- FM TV BUILD V6.1 2026-08-12 -->','<!-- FM TV BUILD V6.2 2026-08-12 -->',1)
          s=s.replace('data-fmtv-build="v6-1-2026-08-12"','data-fmtv-build="v6-2-2026-08-12"',1)
          old="var q=state.query.trim().toLowerCase();if(q)arr=arr.filter(function(v){return(v.title+' '+v.channelName+' '+v.category).toLowerCase().indexOf(q)>-1});"
          new="var q=state.query.trim().toLowerCase();if(q){var terms=[q];if(q.length>3&&q.slice(-1)==='s')terms.push(q.slice(0,-1));else if(q.length>3)terms.push(q+'s');arr=arr.filter(function(v){var hay=(v.title+' '+v.channelName+' '+v.category+' '+(v.description||'')).toLowerCase();return terms.some(function(t){return hay.indexOf(t)>-1})})};"
          if old not in s: raise SystemExit('search filter marker missing')
          s=s.replace(old,new,1)
          out.write_text(s,encoding='utf-8')
          PY

      - name: Validate markers and JavaScript
        run: |
          grep -q 'FM TV BUILD V6.2' fm-tv/blogger-embed-v6-2.html
          grep -q "v.description||''" fm-tv/blogger-embed-v6-2.html
          grep -q "q.slice(0,-1)" fm-tv/blogger-embed-v6-2.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('fm-tv/blogger-embed-v6-2.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/fmtv-v62.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fmtv-v62.js

      - name: Commit V6.2
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v6-2.html
          git commit -m "feat: add smart one-year FM TV search"
          git push
