name: Build Transfer Centre V4.4.1

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_v441.py"
      - ".github/workflows/build-transfer-centre-v441.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build V4.4.1
        run: python scripts/build_v441.py
      - name: Validate runtime syntax
        run: node --check assets/transfer-centre-v441.js
      - name: Confirm app loads V4.4.1
        run: grep -q "assets/transfer-centre-v441.js" transfer-centre-app-v4.html
      - name: Commit frontend build
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/transfer-centre-v441.js transfer-centre-app-v4.html
          if git diff --cached --quiet; then
            echo "No frontend changes."
          else
            git commit -m "feat: build Transfer Centre V4.4.1"
            git pull --rebase origin main
            git push
          fi
