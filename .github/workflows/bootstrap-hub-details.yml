name: Bootstrap Transfer Centre Hubs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-hub-details.yml"

permissions:
  contents: write

concurrency:
  group: transfer-updater
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enrich visible player and club hubs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          HUB_MAX_CALLS: "500"
          HUB_MAX_PLAYERS: "60"
          HUB_MAX_CLUBS: "80"
          HUB_CALL_GAP: "0.4"
        run: python scripts/enrich_hub_details.py
      - name: Rebuild hub cache
        run: python scripts/enrich_transfer_feed.py
      - name: Commit enriched hub data
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hub data changes."
          else
            git commit -m "chore: bootstrap Transfer Centre hubs"
            git fetch origin main
            git rebase origin/main
            git push
          fi
