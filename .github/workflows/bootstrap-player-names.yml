name: Bootstrap Transfer Player Names

on:
  push:
    paths:
      - ".github/workflows/bootstrap-player-names.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-player-name-bootstrap
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve abbreviated player names
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PLAYER_NAME_MAX_CALLS: "1200"
          PLAYER_NAME_CALL_GAP: "0.4"
        run: python scripts/enrich_player_names.py
      - name: Rebuild transfer feed
        run: python scripts/enrich_transfer_feed.py
      - name: Commit enriched names
        run: |
          git config user.name "fm-blog-transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No player-name changes."
          else
            git commit -m "chore: enrich transfer player names"
            git pull --rebase origin main
            git push
          fi
