name: Run FM TV V6.4 Search View

on:
  push:
    paths:
      - "fm-tv/scripts/build_v6_4_search.py"
      - ".github/workflows/run-fm-tv-v6-4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V6.4
        run: python fm-tv/scripts/build_v6_4_search.py
      - name: Validate V6.4
        run: |
          grep -q "FM TV BUILD V6.4 SEARCH VIEW" fm-tv/blogger-embed-v6-4.html
          grep -q "yt-search-result" fm-tv/blogger-embed-v6-4.html
          grep -q "search-view" fm-tv/blogger-embed-v6-4.html
          ! grep -q "Search results for “" fm-tv/blogger-embed-v6-4.html
          ! grep -q "&#8220;" fm-tv/blogger-embed-v6-4.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('fm-tv/blogger-embed-v6-4.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/fmtv-v64.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fmtv-v64.js
      - name: Commit V6.4
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v6-4.html
          if git diff --cached --quiet; then
            echo "No V6.4 changes."
          else
            git commit -m "feat: add dedicated FM TV search results view"
            git pull --rebase origin main
            git push
          fi
