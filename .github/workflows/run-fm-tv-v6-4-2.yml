name: Run FM TV V6.4.2 Thumbnail Overscan Fix

on:
  push:
    paths:
      - "fm-tv/scripts/build_v6_4_2_thumbnail_overscan.py"
      - ".github/workflows/run-fm-tv-v6-4-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V6.4.2
        run: python fm-tv/scripts/build_v6_4_2_thumbnail_overscan.py
      - name: Validate V6.4.2
        run: |
          grep -q "FM TV BUILD V6.4.2 THUMBNAIL OVERSCAN FIX" fm-tv/blogger-embed-v6-4-2.html
          grep -q "width:104%!important" fm-tv/blogger-embed-v6-4-2.html
          grep -q "translate(-50%,-50%)" fm-tv/blogger-embed-v6-4-2.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('fm-tv/blogger-embed-v6-4-2.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/fmtv-v642.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fmtv-v642.js
      - name: Commit V6.4.2
        run: |
          git config user.name "fm-blog-fm-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fm-tv/blogger-embed-v6-4-2.html
          if git diff --cached --quiet; then
            echo "No V6.4.2 changes."
          else
            git commit -m "fix: overscan FM TV thumbnails to remove edge strip"
            git pull --rebase origin main
            git push
          fi
