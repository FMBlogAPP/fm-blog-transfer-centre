<div id="fmbtc-frame-wrap" style="display:block;width:100%;max-width:100%;margin:0;padding:0;overflow:visible;">
  <iframe
    id="fmbtc-frame"
    title="FM Blog Transfer Centre"
    loading="eager"
    scrolling="no"
    referrerpolicy="strict-origin-when-cross-origin"
    style="display:block;width:100%;height:1500px;margin:0;padding:0;border:0;background:#080a0f;overflow:hidden;"
  ></iframe>
</div>
<script>
(function(){
  var frame=document.getElementById('fmbtc-frame');
  if(!frame)return;

  var app=new URL('https://cdn.jsdelivr.net/gh/FMBlogAPP/fm-blog-transfer-centre@main/transfer-centre-app-v4.html');
  app.searchParams.set('build','20260813-v4');

  try{
    var pageParams=new URLSearchParams(window.location.search);
    ['club','player','league','nation','view'].forEach(function(key){
      if(pageParams.has(key))app.searchParams.set(key,pageParams.get(key));
    });
  }catch(e){}

  app.hash='fmbtc';
  frame.src=app.toString();

  window.addEventListener('message',function(event){
    var data=event.data;
    if(!data||data.type!=='fmbtc-height')return;
    var h=parseInt(data.height,10);
    if(!isFinite(h))return;
    frame.style.height=Math.max(700,Math.min(h+8,20000))+'px';
  });
})();
</script>
