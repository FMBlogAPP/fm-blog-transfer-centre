<!-- FMBTC V2.1 ENTITY PATCH -->
<style>
#fmbtc .v21-flag{font-size:17px;line-height:1;display:inline-flex;align-items:center;flex:0 0 auto}
#fmbtc .v21-nation-link{border:0;background:transparent;padding:0;border-radius:0;color:#eef2f8;font-size:12px;font-weight:800;text-align:left}
#fmbtc .v21-nation-link:hover{color:var(--cyan);text-decoration:underline}
#fmbtc .v21-league-line{display:flex!important;align-items:center;gap:6px}
#fmbtc .v21-league-logo{width:19px;height:19px;object-fit:contain;flex:0 0 auto;cursor:pointer}
#fmbtc .club img{cursor:pointer}
#fmbtc .quickbtn{display:inline-flex;align-items:center;gap:6px}
#fmbtc .quickbtn .v21-league-logo{width:17px;height:17px}
#fmbtc .v21-detail{display:none;scroll-margin-top:95px;margin:0 0 12px}
#fmbtc .v21-detail.show{display:block}
#fmbtc .v21-card{border:1px solid #2c3545;background:linear-gradient(135deg,#151a24,#0f131a);border-radius:18px;padding:18px}
#fmbtc .v21-top{display:flex;align-items:center;justify-content:space-between;gap:18px}
#fmbtc .v21-ident{display:flex;align-items:center;gap:14px;min-width:0}
#fmbtc .v21-logo{width:70px;height:70px;object-fit:contain;border-radius:16px;background:#0c1016;border:1px solid #303848;padding:7px;flex:0 0 auto}
#fmbtc .v21-bigflag{width:70px;height:70px;border-radius:16px;background:#0c1016;border:1px solid #303848;display:flex;align-items:center;justify-content:center;font-size:39px;flex:0 0 auto}
#fmbtc .v21-eyebrow{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#8d98aa;margin-bottom:5px}
#fmbtc .v21-title{font-size:clamp(24px,4vw,40px);font-weight:950;letter-spacing:-1px;line-height:1;margin:0;color:#fff}
#fmbtc .v21-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;color:#aeb8c7;font-size:12px}
#fmbtc .v21-sub img{width:20px;height:20px;object-fit:contain}
#fmbtc .v21-back{width:auto;white-space:nowrap;border-radius:999px;padding:9px 12px}
#fmbtc .v21-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
#fmbtc .v21-stat{border:1px solid #293141;background:#0d1118;border-radius:12px;padding:11px 12px}
#fmbtc .v21-stat b{display:block;font-size:20px}
#fmbtc .v21-stat span{display:block;color:#8f9aac;font-size:10px;margin-top:4px}
#fmbtc.v21-entity .db-state:after{content:" · Entity view";color:#8f9aac}
@media(max-width:680px){
 #fmbtc .v21-top{align-items:flex-start}
 #fmbtc .v21-logo,#fmbtc .v21-bigflag{width:54px;height:54px;border-radius:13px;font-size:31px}
 #fmbtc .v21-stats{grid-template-columns:1fr 1fr}
 #fmbtc .v21-back{padding:8px 10px;font-size:11px}
}
</style>
<script>
(function(){
const root=document.getElementById("fmbtc");if(!root||root.dataset.v21Patch)return;root.dataset.v21Patch="1";
const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const BASE="https://raw.githubusercontent.com/FMBlogAPP/fm-blog-transfer-centre/main/",FULL=BASE+"data/transfers.json",CONFIG=BASE+"config.json";
let cfg=null,db=null,detail=null,current=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nf=n=>Number(n||0).toLocaleString("en-GB");
const kind=t=>/loan/i.test(t.type||"")?"loan":/free/i.test(t.type||"")?"free":"permanent";
const codes={England:"GB",Scotland:"GB",Spain:"ES",Italy:"IT",Germany:"DE",France:"FR",Portugal:"PT",Netherlands:"NL",Belgium:"BE",Croatia:"HR",Serbia:"RS",Turkey:"TR",Austria:"AT",Switzerland:"CH",Denmark:"DK",Sweden:"SE",Norway:"NO",Poland:"PL",Czechia:"CZ",Greece:"GR",Argentina:"AR",Brazil:"BR",Colombia:"CO",Uruguay:"UY",Chile:"CL",Peru:"PE",USA:"US",Mexico:"MX",Canada:"CA",Japan:"JP","South Korea":"KR",Australia:"AU"};
const subFlag=tag=>String.fromCodePoint(0x1F3F4,...[...tag].map(c=>0xE0000+c.charCodeAt(0)),0xE007F);
const special={England:subFlag("gbeng"),Scotland:subFlag("gbsct")};
const flag=c=>{if(special[c])return special[c];const x=codes[c];return x?[...x].map(ch=>String.fromCodePoint(127397+ch.charCodeAt(0))).join(""):"🌐"};
const displayCountry=l=>l.display_country||l.country||"";
const leagueObj=(country,league)=>(cfg?.leagues||[]).find(l=>displayCountry(l)===country&&l.name===league);
const leagueLogo=(country,league,id)=>{const lid=id||(leagueObj(country,league)||{}).id;return lid?`https://media.api-sports.io/football/leagues/${lid}.png`:""};
function loadConfig(){return cfg?Promise.resolve(cfg):fetch(CONFIG).then(r=>r.json()).then(x=>cfg=x)}
function loadDb(){return db?Promise.resolve(db):fetch(FULL+"?v="+Date.now()).then(r=>r.json()).then(x=>db=(x.transfers||[]).filter(t=>!t.demo))}
function ensureDetail(){if(detail)return detail;detail=document.createElement("section");detail.className="v21-detail";detail.id="fmbtc-entity";const anchor=$(".controls-shell");anchor.parentNode.insertBefore(detail,anchor);detail.addEventListener("click",e=>{if(e.target.closest(".v21-back"))closeDetail()});return detail}
function scrollDetail(){const el=ensureDetail();requestAnimationFrame(()=>{const y=window.scrollY+el.getBoundingClientRect().top-85;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})})}
function writeUrl(view){try{const u=new URL(location.href);["club","league","nation"].forEach(k=>u.searchParams.delete(k));if(view?.type==="club")u.searchParams.set("club",view.id);if(view?.type==="league"){u.searchParams.set("league",view.league);u.searchParams.set("nation",view.country)}if(view?.type==="nation")u.searchParams.set("nation",view.country);history.pushState({fmbtc21:view},"",u)}catch(e){}}
function countryLeagueForClub(id,rows){for(const t of rows){if(String(t.to_id)===String(id)&&t.to_country)return {country:t.to_country,league:t.to_league,league_id:t.to_league_id,logo:t.to_logo,name:t.to};if(String(t.from_id)===String(id)&&t.from_country)return {country:t.from_country,league:t.from_league,league_id:t.from_league_id,logo:t.from_logo,name:t.from}}const t=rows[0]||{};return String(t.to_id)===String(id)?{logo:t.to_logo,name:t.to}:{logo:t.from_logo,name:t.from}}
function rowCountry(t){return t.country||t.to_country||t.from_country||""}
function rowLeague(t){return t.league||t.to_league||t.from_league||""}
function ownRow(t){const country=rowCountry(t),league=rowLeague(t),logo=leagueLogo(country,league),k=kind(t),bc=k==="loan"?"loan":k==="free"?"free":"";return `<div class="row"><div class="player"><img class="face" src="${esc(t.player_photo)}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="txt"><b>${esc(t.player)}</b><small>${esc(t.position||"Player")}</small></div></div><div class="move"><div class="club"><img src="${esc(t.from_logo)}" loading="lazy"><button class="club-link" data-club="${esc(t.from)}" data-club-id="${esc(t.from_id)}" type="button">${esc(t.from)}</button></div><div class="arrow">→</div><div class="club"><img src="${esc(t.to_logo)}" loading="lazy"><button class="club-link" data-club="${esc(t.to)}" data-club-id="${esc(t.to_id)}" type="button">${esc(t.to)}</button></div></div><div class="competition"><b data-v21="1"><span class="v21-flag">${flag(country)}</span> <button class="v21-nation-link" data-country="${esc(country)}" type="button">${esc(country||"-")}</button></b><small class="v21-league-line">${logo?`<img class="v21-league-logo" src="${esc(logo)}" alt="">`:""}<button class="league-link" data-country="${esc(country)}" data-league="${esc(league)}" type="button">${esc(league||"-")}</button></small></div><div class="date">${esc(t.date)}</div><div class="typec"><span class="badge ${bc}">${k==="loan"?"Loan":k==="free"?"Free":"Permanent"}</span></div></div><div class="mobile"><div class="top"><div class="player"><img class="face" src="${esc(t.player_photo)}" loading="lazy"><div class="txt"><b>${esc(t.player)}</b><small>${flag(country)} ${esc(country)} · ${esc(league)}</small></div></div><span class="badge ${bc}">${k==="loan"?"Loan":k==="free"?"Free":"Permanent"}</span></div><div class="move"><div class="club"><img src="${esc(t.from_logo)}"><button class="club-link" data-club="${esc(t.from)}" data-club-id="${esc(t.from_id)}" type="button">${esc(t.from)}</button></div><div class="arrow">→</div><div class="club"><img src="${esc(t.to_logo)}"><button class="club-link" data-club="${esc(t.to)}" data-club-id="${esc(t.to_id)}" type="button">${esc(t.to)}</button></div></div><div class="bottom"><span>${esc(t.date)}</span><button class="league-link" data-country="${esc(country)}" data-league="${esc(league)}" type="button">${esc(league)}</button></div></div>`}
function renderEntityRows(rows){rows=[...rows].sort((a,b)=>(b.date||"").localeCompare(a.date||""));$(".rows").innerHTML=rows.length?rows.map(ownRow).join(""):`<div class="empty"><b>No transfers found.</b></div>`;$(".count").textContent=nf(rows.length);$(".load").hidden=true;const state=$(".db-state");if(state)state.textContent="Full database";decorate()}
function detailHtml(view,rows){let icon,title,eyebrow,sub,stats;if(view.type==="club"){const m=countryLeagueForClub(view.id,rows);title=view.name||m.name||"Club";eyebrow="Club Transfer Centre";icon=m.logo?`<img class="v21-logo" src="${esc(m.logo)}" alt="${esc(title)} logo">`:`<div class="v21-bigflag">⚽</div>`;sub=m.country?`${flag(m.country)} ${esc(m.country)}${m.league?` · ${leagueLogo(m.country,m.league,m.league_id)?`<img src="${esc(leagueLogo(m.country,m.league,m.league_id))}" alt="">`:""}${esc(m.league)}`:""}`:"All tracked transfer activity";stats=[[rows.length,"Transfers"],[rows.filter(t=>String(t.to_id)===String(view.id)).length,"Incoming"],[rows.filter(t=>String(t.from_id)===String(view.id)).length,"Outgoing"],[rows.filter(t=>kind(t)==="loan").length,"Loans"]]}else if(view.type==="league"){const logo=leagueLogo(view.country,view.league);title=view.league;eyebrow="League Transfer Centre";icon=logo?`<img class="v21-logo" src="${esc(logo)}" alt="${esc(title)} logo">`:`<div class="v21-bigflag">${flag(view.country)}</div>`;sub=`${flag(view.country)} ${esc(view.country)}`;const clubs=new Set(rows.flatMap(t=>[t.from_id,t.to_id]).filter(Boolean));stats=[[rows.length,"Transfers"],[clubs.size,"Clubs involved"],[rows.filter(t=>kind(t)==="loan").length,"Loans"],[rows.filter(t=>kind(t)==="free").length,"Free"]]}else{title=view.country;eyebrow="Nation Transfer Centre";icon=`<div class="v21-bigflag">${flag(view.country)}</div>`;const leagues=new Set(rows.flatMap(t=>[[t.from_country,t.from_league],[t.to_country,t.to_league],[t.country,t.league]]).filter(x=>x[0]===view.country&&x[1]).map(x=>x[1]));sub=`${nf(leagues.size)} tracked league${leagues.size===1?"":"s"}`;const clubs=new Set(rows.flatMap(t=>[t.from_id,t.to_id]).filter(Boolean));stats=[[rows.length,"Transfers"],[clubs.size,"Clubs involved"],[rows.filter(t=>kind(t)==="loan").length,"Loans"],[rows.filter(t=>kind(t)==="free").length,"Free"]]}return `<div class="v21-card"><div class="v21-top"><div class="v21-ident">${icon}<div><div class="v21-eyebrow">${eyebrow}</div><h3 class="v21-title">${esc(title)}</h3><div class="v21-sub">${sub}</div></div></div><button class="v21-back" type="button">← All transfers</button></div><div class="v21-stats">${stats.map(([n,l])=>`<div class="v21-stat"><b>${nf(n)}</b><span>${l}</span></div>`).join("")}</div></div>`}
async function openDetail(view,push=true){await Promise.all([loadConfig(),loadDb()]);current=view;let rows;if(view.type==="club")rows=db.filter(t=>String(t.from_id)===String(view.id)||String(t.to_id)===String(view.id));else if(view.type==="league")rows=db.filter(t=>(t.from_country===view.country&&t.from_league===view.league)||(t.to_country===view.country&&t.to_league===view.league)||(t.country===view.country&&t.league===view.league));else rows=db.filter(t=>t.from_country===view.country||t.to_country===view.country||t.country===view.country);const el=ensureDetail();el.innerHTML=detailHtml(view,rows);el.classList.add("show");root.classList.add("v21-entity");renderEntityRows(rows);if(push)writeUrl(view);scrollDetail()}
function closeDetail(push=true){current=null;root.classList.remove("v21-entity");const el=ensureDetail();el.classList.remove("show");el.innerHTML="";if(push)writeUrl(null);const clear=$(".clear");if(clear)clear.click();requestAnimationFrame(()=>{const c=$(".controls-shell");if(c){const y=window.scrollY+c.getBoundingClientRect().top-85;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}})}
function decorate(){if(!cfg)return;$$('.competition').forEach(c=>{const b=c.querySelector('b');if(b&&!b.dataset.v21){const country=b.textContent.trim();b.dataset.v21='1';b.innerHTML=`<span class="v21-flag">${flag(country)}</span> <button class="v21-nation-link" data-country="${esc(country)}" type="button">${esc(country)}</button>`}const l=c.querySelector('.league-link');if(l&&!c.querySelector('.v21-league-logo')){const logo=leagueLogo(l.dataset.country,l.dataset.league);if(logo){const img=document.createElement('img');img.className='v21-league-logo';img.src=logo;img.alt='';img.addEventListener('click',()=>l.click());const small=l.closest('small');if(small){small.classList.add('v21-league-line');small.insertBefore(img,l)}}}});$$('.quickbtn').forEach(b=>{if(b.dataset.v21)return;b.dataset.v21='1';const logo=leagueLogo(b.dataset.country,b.dataset.league);if(logo){const img=document.createElement('img');img.className='v21-league-logo';img.src=logo;img.alt='';b.insertBefore(img,b.firstChild)}});const ns=$('.nation');if(ns) [...ns.options].forEach(o=>{if(!o.value||o.dataset.v21)return;o.dataset.v21='1';o.textContent=`${flag(o.value)} ${o.textContent}`});const ls=$('.league');if(ls)[...ls.options].forEach(o=>{if(!o.value||o.dataset.v21)return;o.dataset.v21='1';const country=o.value.split('|||')[0];o.textContent=`${flag(country)} ${o.textContent}`})}
loadConfig().then(()=>{decorate();const rows=$('.rows');if(rows)new MutationObserver(()=>decorate()).observe(rows,{childList:true,subtree:true});const quick=$('.quick');if(quick)new MutationObserver(()=>decorate()).observe(quick,{childList:true,subtree:true})});
root.addEventListener('click',e=>{const img=e.target.closest('.club img');if(img){const b=img.parentElement?.querySelector('.club-link');if(b){b.click();return}}const club=e.target.closest('.club-link');if(club){openDetail({type:'club',id:club.dataset.clubId||'',name:club.dataset.club});return}const nation=e.target.closest('.v21-nation-link');if(nation){e.preventDefault();openDetail({type:'nation',country:nation.dataset.country});return}const league=e.target.closest('.league-link');if(league&&league.dataset.country&&league.dataset.league){openDetail({type:'league',country:league.dataset.country,league:league.dataset.league});return}const quick=e.target.closest('.quickbtn');if(quick){openDetail({type:'league',country:quick.dataset.country,league:quick.dataset.league})}});
async function restore(){try{const p=new URL(location.href).searchParams,club=p.get('club'),league=p.get('league'),nation=p.get('nation');if(!club&&!league&&!nation)return;await Promise.all([loadConfig(),loadDb()]);if(club){const r=db.find(t=>String(t.from_id)===club||String(t.to_id)===club);openDetail({type:'club',id:club,name:r?(String(r.from_id)===club?r.from:r.to):'Club'},false);return}if(league&&nation){openDetail({type:'league',country:nation,league},false);return}if(nation)openDetail({type:'nation',country:nation},false)}catch(e){}}
setTimeout(restore,450);
window.addEventListener('popstate',()=>{const p=new URL(location.href).searchParams;if(!p.get('club')&&!p.get('league')&&!p.get('nation'))closeDetail(false);else restore()});
})();
</script>
